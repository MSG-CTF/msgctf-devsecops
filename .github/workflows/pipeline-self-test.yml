name: 문제 공급망 파이프라인 자체 검증

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/challenge-branch-validation.yml"
      - ".github/workflows/challenge-supply-chain.yml"
      - ".github/workflows/pipeline-self-test.yml"
      - "ci/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/challenge-branch-validation.yml"
      - ".github/workflows/challenge-supply-chain.yml"
      - ".github/workflows/pipeline-self-test.yml"
      - "ci/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      check_gcp_runtime_connection:
        description: GCP Runtime HTTPS 연결·비인증 차단 점검 (생성·삭제 없음)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime-https-preflight:
    name: GCP Runtime HTTPS 읽기 전용 연결 점검
    if: github.event_name == 'workflow_dispatch' && inputs.check_gcp_runtime_connection
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: 공급망 도구 가져오기
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HTTPS·인증 차단 확인
        run: |
          python3 -m scripts.runtime_connection_probe \
            --api-url https://34.67.93.98:443/internal/v1 \
            --output dist/gcp-runtime-connection.json
      - name: 연결 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-runtime-connection-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/gcp-runtime-connection.json
          if-no-files-found: error
          retention-days: 90

  unit-test:
    name: 명세 및 artifact 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 검증 의존성 설치
        run: python3 -m pip install -r ci/requirements.txt

      - name: 전체 단위 테스트
        run: python3 -m unittest discover -s tests -v

      - name: Python 문법 검사
        run: python3 -m py_compile scripts/*.py

  sample-server-challenge:
    name: 샘플 서버 문제 build·scan·publish
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/challenge-supply-chain.yml
    with:
      challenge_path: tests/fixtures/info-valid
      revision: ${{ github.run_number }}
      devsecops_ref: ${{ github.sha }}
      enable_k3s_smoke_deploy: false
    secrets: inherit

  branch-validation:
    name: 출제 branch 최소 권한 build·scan
    needs: unit-test
    permissions:
      contents: read
    uses: ./.github/workflows/challenge-branch-validation.yml
    with:
      challenge_path: tests/fixtures/info-valid
      source_ref: ${{ github.sha }}
      devsecops_ref: ${{ github.sha }}

  koth-challenge:
    name: KOTH 공식 양식 build·scan·publish
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/challenge-supply-chain.yml
    with:
      challenge_path: tests/fixtures/koth-template
      revision: ${{ github.run_number }}
      devsecops_ref: ${{ github.sha }}
      enable_k3s_smoke_deploy: false
    secrets: inherit
