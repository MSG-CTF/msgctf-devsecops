name: 문제 공급망 파이프라인 자체 검증

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/challenge-branch-validation.yml"
      - ".github/workflows/challenge-supply-chain.yml"
      - ".github/workflows/pipeline-self-test.yml"
      - "ci/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/challenge-branch-validation.yml"
      - ".github/workflows/challenge-supply-chain.yml"
      - ".github/workflows/pipeline-self-test.yml"
      - "ci/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: 명세 및 artifact 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 검증 의존성 설치
        run: python3 -m pip install -r ci/requirements.txt

      - name: 전체 단위 테스트
        run: python3 -m unittest discover -s tests -v

      - name: Python 문법 검사
        run: python3 -m py_compile scripts/*.py

  sample-server-challenge:
    name: 샘플 서버 문제 build·scan·publish
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/challenge-supply-chain.yml
    with:
      challenge_path: tests/fixtures/info-valid
      revision: ${{ github.run_number }}
      devsecops_ref: ${{ github.sha }}
      enable_k3s_smoke_deploy: false
    secrets: inherit

  branch-validation:
    name: 출제 branch 최소 권한 build·scan
    needs: unit-test
    permissions:
      contents: read
    uses: ./.github/workflows/challenge-branch-validation.yml
    with:
      challenge_path: tests/fixtures/info-valid
      source_ref: ${{ github.sha }}
      devsecops_ref: ${{ github.sha }}

  koth-challenge:
    name: KOTH 공식 양식 build·scan·publish
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/challenge-supply-chain.yml
    with:
      challenge_path: tests/fixtures/koth-template
      revision: ${{ github.run_number }}
      devsecops_ref: ${{ github.sha }}
      enable_k3s_smoke_deploy: false
    secrets: inherit
