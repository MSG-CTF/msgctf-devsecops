name: 플랫폼 컴포넌트 공통 CI

on:
  workflow_call:
    inputs:
      component_name:
        required: true
        type: string
      context:
        required: false
        default: .
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      test_command:
        required: true
        type: string
      push_image:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      component_name:
        required: true
        type: string
      context:
        required: false
        default: .
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      test_command:
        required: true
        type: string
      push_image:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 팀 테스트 실행
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 입력 경로 검증
        env:
          COMPONENT_NAME: ${{ inputs.component_name }}
          BUILD_CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          [[ "$COMPONENT_NAME" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          context_path="$(realpath "$BUILD_CONTEXT")"
          workspace_path="$(realpath "$GITHUB_WORKSPACE")"
          [[ "$context_path" == "$workspace_path" || "$context_path" == "$workspace_path/"* ]]
          test -f "${context_path}/${DOCKERFILE}"

      - name: Gitleaks 검사
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            dir /repo --redact --verbose

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: OCI image 이름 설정
        id: image
        env:
          COMPONENT_NAME: ${{ inputs.component_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/platform/${COMPONENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: 검사할 image 한 번만 빌드
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Trivy 취약점 차단 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image secret 차단 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: CycloneDX SBOM 생성
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: cyclonedx
          output: component.cdx.json
          scanners: vuln
          exit-code: "0"

      - name: OCI Registry 로그인
        if: inputs.push_image && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 검사한 동일 image 발행
        id: publish
        if: inputs.push_image && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RUN_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker push "${IMAGE}:${RUN_TAG}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${RUN_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg component "${{ inputs.component_name }}" \
            --arg image "${IMAGE}@${digest}" \
            --arg source_ref "$GITHUB_SHA" \
            '{
              schema_version: "1.0",
              component: $component,
              image: $image,
              source_ref: $source_ref,
              scan_result: "PASS",
              sbom: "component.cdx.json"
            }' > component-image.json

      - name: image metadata와 SBOM 업로드
        if: inputs.push_image && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component_name }}-image-metadata
          path: |
            component-image.json
            component.cdx.json
