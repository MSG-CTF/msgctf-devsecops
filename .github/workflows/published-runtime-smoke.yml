name: 발행 bundle 독립 Runtime 검증

on:
  workflow_call:
    inputs:
      source_run_id:
        description: 성공한 main 출제 문제 검증 run ID
        required: true
        type: string
      challenge_slug:
        description: Runtime 정책에서 승인한 단일 WEB 문제 slug
        required: true
        type: string
      confirm_deploy:
        description: 승인한 CI 대상에 임시 생성·삭제를 실행할지 확인
        required: false
        default: false
        type: boolean
      devsecops_ref:
        description: 검토한 공급망 도구 commit SHA
        required: true
        type: string
      runtime_api_url:
        required: true
        type: string
      runtime_ci_team_id:
        required: true
        type: string
      runtime_target_id:
        required: true
        type: string
    secrets:
      RUNTIME_API_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 수동 main 실행과 승인 확인
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CHALLENGE_SLUG: ${{ inputs.challenge_slug }}
          DEVSECOPS_REF: ${{ inputs.devsecops_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_DEPLOY" = true || { echo "임시 생성·삭제 승인 확인이 필요합니다" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]] || { echo "run ID 형식을 확인하세요" >&2; exit 1; }
          [[ "$CHALLENGE_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "문제 slug 형식을 확인하세요" >&2; exit 1; }
          [[ "$DEVSECOPS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "검토한 도구 SHA가 필요합니다" >&2; exit 1; }

      - name: 검토한 Runtime 도구 가져오기
        uses: actions/checkout@v4
        with:
          repository: MSG-CTF/msgctf-devsecops
          ref: ${{ inputs.devsecops_ref }}
          path: .msgctf-ci
          persist-credentials: false

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 성공한 발행 실행과 전체 artifact 목록 조회
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > evidence/run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > evidence/pages.json

      - name: 발행 출처와 bundle 선택 검증
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CHALLENGE_SLUG: ${{ inputs.challenge_slug }}
        run: |
          python3 .msgctf-ci/scripts/validate_runtime_smoke_source.py select \
            --run evidence/run.json --pages evidence/pages.json \
            --repository "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID" \
            --challenge-slug "$CHALLENGE_SLUG" \
            --output evidence/selection.json --github-output "$GITHUB_OUTPUT"

      - name: 검증한 발행 bundle만 가져오기
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist/publish-bundle

      - name: CI 전용 대상과 bundle 계약 확인
        env:
          RUNTIME_API_URL: ${{ inputs.runtime_api_url }}
          RUNTIME_CI_TEAM_ID: ${{ inputs.runtime_ci_team_id }}
          RUNTIME_TARGET_ID: ${{ inputs.runtime_target_id }}
          SMOKE_KEY: ${{ github.repository_id }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$RUNTIME_API_URL" in https://*) ;; *) echo "Runtime HTTPS URL이 필요합니다" >&2; exit 1 ;; esac
          test -n "$RUNTIME_CI_TEAM_ID" || { echo "CI 전용 team ID가 필요합니다" >&2; exit 1; }
          test -n "$RUNTIME_TARGET_ID" || { echo "target ID가 필요합니다" >&2; exit 1; }
          instance_id="$(python3 -c 'import os, uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, os.environ["SMOKE_KEY"]))')"
          jq -n --arg team_id "$RUNTIME_CI_TEAM_ID" --arg target_id "$RUNTIME_TARGET_ID" --arg instance_id "$instance_id" \
            '{team_id:$team_id,target_id:$target_id,instance_id:$instance_id}' > evidence/runtime-config.json
          python3 .msgctf-ci/scripts/validate_runtime_smoke_source.py verify \
            --artifact dist/publish-bundle/artifact-v2.json \
            --selection evidence/selection.json --config evidence/runtime-config.json

      - name: 독립 Runtime HTTPS 생성·삭제 검증
        env:
          RUNTIME_API_URL: ${{ inputs.runtime_api_url }}
          RUNTIME_API_TOKEN: ${{ secrets.RUNTIME_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RUNTIME_API_TOKEN" || { echo "RUNTIME_API_TOKEN Secret이 필요합니다" >&2; exit 1; }
          umask 077
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT INT TERM
          printf '%s' "$RUNTIME_API_TOKEN" > "$token_file"
          python3 .msgctf-ci/scripts/runtime_api_smoke_runner.py \
            --artifact dist/publish-bundle/artifact-v2.json \
            --config evidence/runtime-config.json --api-url "$RUNTIME_API_URL" \
            --token-file "$token_file" --timeout 300 --cleanup-timeout 300 \
            | tee evidence/runtime-smoke-result.txt
          result="$(sed -n 's/^MSGCTF_RUNTIME_SMOKE_RESULT=//p' evidence/runtime-smoke-result.txt | tail -n 1)"
          test -n "$result"
          printf '%s\n' "$result" | jq -e '.create_status == "SUCCEEDED" and .delete_status == "SUCCEEDED"' >/dev/null
          {
            echo "## 발행본 독립 Runtime 검증"
            echo '출처·결과는 아래 증거에 기록하며 Backend 등록·활성화는 수행하지 않습니다.'
            echo '```json'
            cat evidence/selection.json
            printf '%s\n' "$result" | jq
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 출처와 Runtime 시험 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/selection.json
            evidence/runtime-smoke-result.txt
          if-no-files-found: warn
          retention-days: 14
