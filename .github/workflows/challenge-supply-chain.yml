name: 문제 공급망 CI

on:
  workflow_call:
    inputs:
      challenge_path:
        description: info.yaml이 있는 문제 디렉터리
        required: true
        type: string
      revision:
        description: Challenge Registry revision
        required: true
        type: string
      enable_k3s_smoke_deploy:
        description: AWS K3s 임시 배포 검증 실행 여부
        required: false
        default: false
        type: boolean
    outputs:
      challenge_slug:
        description: 검증 및 발행된 문제 slug
        value: ${{ jobs.aggregate.outputs.challenge_slug }}
      publish_bundle_name:
        description: Runtime과 Challenge Registry가 내려받을 Actions artifact 이름
        value: ${{ jobs.aggregate.outputs.publish_bundle_name }}
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      AWS_REGION:
        required: false
      AWS_K3S_INSTANCE_ID:
        required: false
      AWS_CD_ARTIFACT_BUCKET:
        required: false
      GHCR_PULL_SECRET_ARN:
        required: false
  workflow_dispatch:
    inputs:
      challenge_path:
        description: info.yaml이 있는 문제 디렉터리
        required: true
        type: string
      revision:
        description: Challenge Registry revision
        required: true
        type: string
      enable_k3s_smoke_deploy:
        description: AWS K3s 임시 배포 검증 실행 여부
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      challenge_slug: ${{ steps.spec.outputs.challenge_slug }}
      is_server: ${{ steps.spec.outputs.is_server }}
      matrix: ${{ steps.spec.outputs.matrix }}
    steps:
      - name: 문제 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DevSecOps 도구 가져오기
        uses: actions/checkout@v4
        with:
          repository: MSG-CTF/msgctf-devsecops
          ref: main
          path: .msgctf-ci

      - name: 검증 도구 설치
        run: python3 -m pip install -r .msgctf-ci/ci/requirements.txt

      - name: 저장소 Gitleaks 검사
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            dir /repo --redact --verbose

      - name: info.yaml 및 Docker build context 검증
        id: spec
        env:
          CHALLENGE_PATH: ${{ inputs.challenge_path }}
        run: |
          python3 .msgctf-ci/scripts/validate_info_spec.py "$CHALLENGE_PATH" \
            --metadata-output supply-chain/metadata.json \
            --matrix-output supply-chain/matrix.json \
            --github-output "$GITHUB_OUTPUT"

      - name: 검증된 metadata 업로드
        uses: actions/upload-artifact@v4
        with:
          name: challenge-metadata
          path: supply-chain/

  build-scan-push:
    needs: validate
    if: needs.validate.outputs.is_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: 문제 저장소 가져오기
        uses: actions/checkout@v4

      - name: 검증된 metadata 가져오기
        uses: actions/download-artifact@v4
        with:
          name: challenge-metadata
          path: supply-chain

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: image 작업 환경 설정
        id: image
        env:
          CHALLENGE_SLUG: ${{ needs.validate.outputs.challenge_slug }}
          CONTAINER_NAME: ${{ matrix.name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          architecture="$(jq -r .architecture supply-chain/metadata.json)"
          case "$architecture" in
            AMD64) platform="linux/amd64" ;;
            ARM64) platform="linux/arm64" ;;
            *) echo "지원하지 않는 architecture입니다" >&2; exit 1 ;;
          esac
          echo "target=${REGISTRY}/${owner}/challenges/${CHALLENGE_SLUG}/${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: build 컨테이너 image 생성
        if: matrix.source_type == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.challenge_path }}/${{ matrix.source }}
          platforms: ${{ steps.image.outputs.platform }}
          load: true
          tags: ${{ steps.image.outputs.target }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 외부 OCI image 가져오기
        if: matrix.source_type == 'image'
        id: external
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: ${{ steps.image.outputs.target }}
          PLATFORM: ${{ steps.image.outputs.platform }}
          RUN_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker pull --platform "$PLATFORM" "$SOURCE_IMAGE"
          pinned="$(docker image inspect "$SOURCE_IMAGE" --format '{{index .RepoDigests 0}}')"
          source_digest="${pinned##*@}"
          docker tag "$SOURCE_IMAGE" "${TARGET_IMAGE}:${RUN_TAG}"
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Trivy 취약점 차단 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.target }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image secret 차단 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.target }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: CycloneDX SBOM 디렉터리 생성
        env:
          CONTAINER_NAME: ${{ matrix.name }}
        run: mkdir -p "results/${CONTAINER_NAME}/sbom"

      - name: CycloneDX SBOM 생성
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.target }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: cyclonedx
          output: results/${{ matrix.name }}/sbom/${{ matrix.name }}.cdx.json
          scanners: vuln
          exit-code: "0"

      - name: OCI Registry 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 검사한 동일 image 발행
        id: publish
        if: github.event_name != 'pull_request'
        env:
          TARGET_IMAGE: ${{ steps.image.outputs.target }}
          SOURCE_DIGEST: ${{ steps.external.outputs.source_digest }}
          RUN_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          local_ref="${TARGET_IMAGE}:${RUN_TAG}"
          if [ -z "$SOURCE_DIGEST" ]; then
            SOURCE_DIGEST="$(docker image inspect "$local_ref" --format '{{.Id}}')"
          fi
          docker push "$local_ref"
          digest="$(docker buildx imagetools inspect "$local_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "source_digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: 컨테이너 발행 결과 생성
        if: github.event_name != 'pull_request'
        env:
          CONTAINER_NAME: ${{ matrix.name }}
          TARGET_IMAGE: ${{ steps.image.outputs.target }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_DIGEST: ${{ steps.publish.outputs.source_digest }}
        run: |
          jq -n \
            --arg name "$CONTAINER_NAME" \
            --arg image "${TARGET_IMAGE}@${PUBLISHED_DIGEST}" \
            --arg source_digest "$SOURCE_DIGEST" \
            --arg sbom "results/${CONTAINER_NAME}/sbom/${CONTAINER_NAME}.cdx.json" \
            '{
              name: $name,
              image: $image,
              source_digest: $source_digest,
              sbom: $sbom,
              scan_result: "PASS"
            }' > "results/${CONTAINER_NAME}/container-result.json"

      - name: 컨테이너 결과 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: container-result-${{ matrix.name }}
          path: results/

  aggregate:
    needs:
      - validate
      - build-scan-push
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.validate.result == 'success' &&
      needs.build-scan-push.result == 'success' &&
      needs.validate.outputs.is_server == 'true'
    runs-on: ubuntu-latest
    outputs:
      challenge_slug: ${{ needs.validate.outputs.challenge_slug }}
      publish_bundle_name: ${{ steps.summary.outputs.bundle_name }}
    permissions:
      contents: read
    steps:
      - name: DevSecOps 도구 가져오기
        uses: actions/checkout@v4
        with:
          repository: MSG-CTF/msgctf-devsecops
          ref: main
          path: .msgctf-ci

      - name: 검증된 metadata 가져오기
        uses: actions/download-artifact@v4
        with:
          name: challenge-metadata
          path: dist/input

      - name: 컨테이너 결과와 SBOM 가져오기
        uses: actions/download-artifact@v4
        with:
          pattern: container-result-*
          path: dist/results
          merge-multiple: true

      - name: Runtime artifact와 Registry publish document 생성
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          python3 .msgctf-ci/scripts/generate_publish_bundle.py \
            --metadata dist/input/metadata.json \
            --results-dir dist/results \
            --source-ref "$GITHUB_SHA" \
            --revision "$REVISION" \
            --artifact-output dist/artifact-v2.json \
            --registry-output dist/registry-publish.json

      - name: GHCR digest 발행 결과 요약
        id: summary
        env:
          BUNDLE_NAME: ${{ needs.validate.outputs.challenge_slug }}-publish-bundle
        run: |
          echo "bundle_name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          python3 .msgctf-ci/scripts/render_publish_summary.py \
            --artifact dist/artifact-v2.json \
            --bundle-name "$BUNDLE_NAME" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Atomic Publish bundle 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.summary.outputs.bundle_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  k3s-smoke-deploy:
    needs:
      - validate
      - aggregate
    if: >-
      inputs.enable_k3s_smoke_deploy &&
      needs.aggregate.result == 'success' &&
      needs.validate.outputs.is_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: DevSecOps 도구 가져오기
        uses: actions/checkout@v4
        with:
          repository: MSG-CTF/msgctf-devsecops
          ref: main
          path: .msgctf-ci

      - name: 발행 bundle 가져오기
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.challenge_slug }}-publish-bundle
          path: dist

      - name: K3s smoke manifest 생성
        id: smoke
        env:
          CHALLENGE_SLUG: ${{ needs.validate.outputs.challenge_slug }}
        run: |
          namespace="ci-smoke-${CHALLENGE_SLUG}-${GITHUB_RUN_ID}"
          namespace="${namespace:0:63}"
          workload="smoke-${CHALLENGE_SLUG}"
          workload="${workload:0:63}"
          port="$(jq -r '.workload.containers[0].ports[] | select(.public == true) | .port' dist/artifact-v2.json)"
          python3 .msgctf-ci/scripts/render_k3s_smoke_manifest.py \
            --artifact dist/artifact-v2.json \
            --namespace "$namespace" \
            --image-pull-secret ghcr-pull \
            --output dist/k3s-smoke-manifest.json
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "workload=$workload" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: AWS OIDC 인증
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: S3 staging 경로 업로드
        id: staging
        env:
          BUCKET: ${{ secrets.AWS_CD_ARTIFACT_BUCKET }}
        run: |
          prefix="k3s-smoke/${GITHUB_REPOSITORY_ID}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          aws s3 cp dist/k3s-smoke-manifest.json "s3://${BUCKET}/${prefix}/manifest.json"
          aws s3 cp .msgctf-ci/scripts/k3s_smoke_runner.py "s3://${BUCKET}/${prefix}/k3s_smoke_runner.py"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: SSM으로 K3s smoke test 실행
        env:
          INSTANCE_ID: ${{ secrets.AWS_K3S_INSTANCE_ID }}
          BUCKET: ${{ secrets.AWS_CD_ARTIFACT_BUCKET }}
          PREFIX: ${{ steps.staging.outputs.prefix }}
          NAMESPACE: ${{ steps.smoke.outputs.namespace }}
          WORKLOAD: ${{ steps.smoke.outputs.workload }}
          PORT: ${{ steps.smoke.outputs.port }}
          GHCR_SECRET_ARN: ${{ secrets.GHCR_PULL_SECRET_ARN }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "MSGCTF temporary K3s smoke deployment" \
            --parameters "commands=[\"set -euo pipefail\",\"mkdir -p /tmp/msgctf-k3s-smoke\",\"aws s3 cp s3://${BUCKET}/${PREFIX}/manifest.json /tmp/msgctf-k3s-smoke/manifest.json\",\"aws s3 cp s3://${BUCKET}/${PREFIX}/k3s_smoke_runner.py /tmp/msgctf-k3s-smoke/k3s_smoke_runner.py\",\"python3 /tmp/msgctf-k3s-smoke/k3s_smoke_runner.py --manifest /tmp/msgctf-k3s-smoke/manifest.json --namespace ${NAMESPACE} --workload ${WORKLOAD} --port ${PORT} --ghcr-secret-arn ${GHCR_SECRET_ARN}\"]" \
            --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM smoke test timed out" >&2
          exit 1

      - name: S3 staging 파일 정리
        if: always()
        env:
          BUCKET: ${{ secrets.AWS_CD_ARTIFACT_BUCKET }}
          PREFIX: ${{ steps.staging.outputs.prefix }}
        run: aws s3 rm "s3://${BUCKET}/${PREFIX}" --recursive
