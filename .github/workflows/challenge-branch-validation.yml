name: 문제 branch CI

on:
  workflow_call:
    inputs:
      challenge_path:
        description: info.yaml이 있는 문제 디렉터리
        required: true
        type: string
      source_ref:
        description: 검사할 문제 저장소 commit SHA 또는 branch
        required: true
        type: string
      devsecops_ref:
        description: 검증 도구를 가져올 msgctf-devsecops ref
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 문제 명세 검증
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_scope: ${{ steps.scope.outputs.artifact_scope }}
      challenge_slug: ${{ steps.spec.outputs.challenge_slug }}
      devsecops_sha: ${{ steps.tools.outputs.commit }}
      is_server: ${{ steps.spec.outputs.is_server }}
      matrix: ${{ steps.spec.outputs.matrix }}
    steps:
      - name: 문제 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: DevSecOps 도구 가져오기
        id: tools
        uses: actions/checkout@v4
        with:
          repository: MSG-CTF/msgctf-devsecops
          ref: ${{ inputs.devsecops_ref }}
          path: .msgctf-ci

      - name: 검증 도구 설치
        run: python3 -m pip install -r .msgctf-ci/ci/requirements.txt

      - name: 저장소 Gitleaks 검사
        run: |
          gitleaks() {
            docker run --rm \
              -v "$PWD:/repo" \
              ghcr.io/gitleaks/gitleaks:v8.24.3 "$@"
          }
          gitleaks git --redact --verbose \
            --log-opts="--full-history HEAD --diff-filter=tuxdb" /repo
          gitleaks dir --redact --verbose /repo

      - name: info.yaml 및 Docker build context 검증
        id: spec
        env:
          CHALLENGE_PATH: ${{ inputs.challenge_path }}
        run: |
          python3 .msgctf-ci/scripts/validate_info_spec.py "$CHALLENGE_PATH" \
            --metadata-output branch-validation/metadata.json \
            --matrix-output branch-validation/matrix.json \
            --github-output "$GITHUB_OUTPUT"

      - name: 검증 artifact scope 생성
        id: scope
        run: |
          nonce="$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          echo "artifact_scope=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${nonce}" >> "$GITHUB_OUTPUT"

      - name: 검증된 metadata 업로드
        uses: actions/upload-artifact@v4
        with:
          name: branch-metadata-${{ steps.scope.outputs.artifact_scope }}
          path: branch-validation/
          if-no-files-found: error
          retention-days: 14

  build-scan:
    name: ${{ matrix.name }} build·scan
    needs: validate
    if: needs.validate.outputs.is_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: 문제 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: DevSecOps 도구 가져오기
        uses: actions/checkout@v4
        with:
          repository: MSG-CTF/msgctf-devsecops
          ref: ${{ needs.validate.outputs.devsecops_sha }}
          path: .msgctf-ci

      - name: 검증된 metadata 가져오기
        uses: actions/download-artifact@v4
        with:
          name: branch-metadata-${{ needs.validate.outputs.artifact_scope }}
          path: branch-validation

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 검사할 image 참조 생성
        id: image
        env:
          ARTIFACT_SCOPE: ${{ needs.validate.outputs.artifact_scope }}
          CHALLENGE_SLUG: ${{ needs.validate.outputs.challenge_slug }}
          CONTAINER_NAME: ${{ matrix.name }}
        run: |
          architecture="$(jq -r .architecture branch-validation/metadata.json)"
          case "$architecture" in
            AMD64) platform="linux/amd64" ;;
            ARM64) platform="linux/arm64" ;;
            *) echo "지원하지 않는 architecture입니다" >&2; exit 1 ;;
          esac
          echo "ref=msgctf-validation/${CHALLENGE_SLUG}/${CONTAINER_NAME}:${GITHUB_SHA}-${ARTIFACT_SCOPE}" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: build 컨테이너 image 생성
        if: matrix.source_type == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.challenge_path }}/${{ matrix.source }}
          platforms: ${{ steps.image.outputs.platform }}
          load: true
          tags: ${{ steps.image.outputs.ref }}

      - name: 외부 OCI image 가져오기
        if: matrix.source_type == 'image'
        env:
          PLATFORM: ${{ steps.image.outputs.platform }}
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker pull --platform "$PLATFORM" "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

      - name: Trivy 취약점 차단 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image secret 차단 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: CycloneDX SBOM 디렉터리 생성
        env:
          CONTAINER_NAME: ${{ matrix.name }}
        run: mkdir -p "branch-results/${CONTAINER_NAME}/sbom"

      - name: CycloneDX SBOM 생성
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: branch-results/${{ matrix.name }}/sbom/${{ matrix.name }}.cdx.json
          scanners: vuln
          exit-code: "0"

      - name: branch 검사 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: branch-scan-${{ needs.validate.outputs.artifact_scope }}-${{ matrix.name }}
          path: branch-results/
          if-no-files-found: error
          retention-days: 14
