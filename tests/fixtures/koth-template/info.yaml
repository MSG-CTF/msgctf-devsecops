name: KOTH Problem Name
category: koth
description: |-
  참가자는 KOTH 문제 서버에 접속해 팀 토큰으로 인증한 뒤 목표 상태를 만들고 유지해야 합니다.
  플랫폼 백엔드는 15분마다 문제 서버의 공통 점수 API를 조회해 구간별 등수를 반영합니다.
flag: msgctf2026{replace_this}

deployment:
  runtime_type: KUBERNETES
  architecture: AMD64
  containers:
    - name: service
      build: ./prob/for_organizer/service
      ports: [8080, 9090]
      expose: true
  resource_profile:
    cpu_millicores: 500
    memory_mib: 512
    ephemeral_storage_mib: 1024
  healthcheck:
    container: service
    port: 9090
    path: /healthz
